<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>T1 Órdenes del taller (celular)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/garweb/tokens.css">
<link rel="stylesheet" href="ds/garweb/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<script src="ds/garweb/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
.th{display:flex;align-items:center;gap:12px;padding:18px 16px 16px;background:var(--navy-950);color:#FFFFFF}
.th .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563EB,#38BDF8);font-weight:700}
.oc{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink)}
.oc.cur{border-color:var(--primary)}
.oc .pct{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}
.prog{height:12px;border-radius:9999px;background:var(--primary-soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--accent))}
.go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;background:var(--primary);color:var(--on-primary);font:700 16px/1 var(--font-sans)}
.go.sec{background:var(--surface);color:var(--ink);border:2px solid var(--line-strong)}
.flt{display:flex;gap:8px;overflow-x:auto}
.flt button{min-height:40px;padding:0 14px;border-radius:9999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 13.5px/1 var(--font-sans);white-space:nowrap;cursor:pointer}
.flt button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
</style>
</helmet>
<div class="phone" style="width: 390px; min-height: 1200px">
  <div class="th">
    <span class="av">C</span>
    <div style="flex: 1"><b style="font-size: 17px">Carlos · producción</b><div style="font-size: 13px; color: #A9BEE3">mar 13 oct · 08:02 · Taller</div></div>
    <b style="font-family: var(--font-display); font-weight: 800; font-size: 16px">GARWEB</b>
  </div>
  <div class="ph-body">
    <div class="between"><h1 style="font-size: 24px; font-weight: 800">Órdenes del taller</h1><span class="pill">3 · 1 en pausa</span></div>
    <div class="flt" role="group" aria-label="Filtrar órdenes"><sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button class="{{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
    <sc-for list="{{list}}" as="o" hint-placeholder-count="3">
      <a class="{{o.cls}}" href="T2-Orden.dc.html">
        <div class="between"><b class="num" style="font-size: 14px; color: var(--ink-muted)">{{o.code}}</b><x-import component-from-global-scope="Garweb.StatusChip" status="{{o.status}}"></x-import></div>
        <div><h2 style="font-size: 20px; line-height: 26px">{{o.item}}</h2><span class="muted" style="font-size: 14px">{{o.who}}</span></div>
        <div class="row" style="{{o.noteStyle}}"><x-import component-from-global-scope="Garweb.Icon" name="{{o.icon}}" size="{{ 18 }}"></x-import>{{o.note}}</div>
        <div class="between"><span class="pct num">{{o.pct}}</span><span class="muted" style="font-size: 13px">{{o.acts}}</span></div>
        <div class="prog"><i style="{{o.bar}}"></i></div>
        <span class="{{o.goCls}}">{{o.go}}</span>
      </a>
    </sc-for>
    <p class="audit">Todo el equipo ve todas las órdenes del taller. La fecha objetivo viene de A7 Planificar.</p>
  </div>
  <nav class="tabbar" aria-label="Navegación de la app"><a class="on" aria-current="page" href="T1-Ordenes.dc.html"><x-import component-from-global-scope="Garweb.Icon" name="clipboard" size="{{ 22 }}"></x-import>Órdenes</a><a href="T2-Orden.dc.html"><x-import component-from-global-scope="Garweb.Icon" name="scissors" size="{{ 22 }}"></x-import>Orden actual</a><a href="G1-Acceso.dc.html"><x-import component-from-global-scope="Garweb.Icon" name="lock" size="{{ 22 }}"></x-import>Salir</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 0 }; }
  renderVals() {
    const O = [
      { code: 'PED-0076', status: 'En producción', item: 'Sofá de 3 cuerpos', who: 'Laura Méndez · Lino Navy 204', note: 'Para el vie 16 oct', icon: 'calendar', noteStyle: 'font-size: 15px; font-weight: 600', pct: '60%', acts: '3 de 6 actividades', bar: 'width: 60%', go: 'Abrir orden', goCls: 'go', cls: 'oc cur' },
      { code: 'PED-0077', status: 'En pausa', item: 'Sillón Berger', who: 'Robert King · Terciopelo verde', note: 'Daño oculto: esperando al cliente (V2)', icon: 'pause', noteStyle: 'font-size: 15px; font-weight: 600; color: var(--warning-ink)', pct: '40%', acts: '2 de 5 actividades', bar: 'width: 40%; background: var(--warning-500)', go: 'Ver orden', goCls: 'go sec', cls: 'oc' },
      { code: 'PED-0080', status: 'Listo para producir', item: 'Banqueta', who: 'Daniel Cruz · tela del cliente', note: 'Atrasada: era para el vie 9 oct', icon: 'alert', noteStyle: 'font-size: 15px; font-weight: 600; color: var(--danger-ink)', pct: '0%', acts: '0 de 4 actividades', bar: 'width: 2%', go: 'Iniciar trabajo', goCls: 'go', cls: 'oc' }
    ];
    const F = [['Todas', () => true], ['En producción', o => o.status === 'En producción'], ['En pausa', o => o.status === 'En pausa'], ['Por iniciar', o => o.status === 'Listo para producir']];
    return {
      filters: F.map((f, i) => ({ label: f[0], on: this.state.f === i, cls: this.state.f === i ? 'on' : '', pick: () => this.setState({ f: i }) })),
      list: O.filter(F[this.state.f][1])
    };
  }
}
</script>
</body>
</html>
